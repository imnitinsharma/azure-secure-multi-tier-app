name: DevSecOps CI/CD Pipeline to Azure

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  security-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # Gate 1: Static Application Security Testing & Secret Scanning
      - name: Run Trivy File System Scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          ignore-unfixed: true
          format: 'table'
          severity: 'CRITICAL,HIGH'

      # Build Hardened Container
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Image
        run: |
          docker build -t fastapi-app:v1 .

      # Gate 2: Container Image Vulnerability Scan
      - name: Scan Docker Image with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'fastapi-app:v1'
          format: 'table'
          severity: 'CRITICAL,HIGH'

      # --- CONTINUOUS DEPLOYMENT (CD) STAGES ---

      # Step 1: Authenticate with Azure securely using Service Principal
      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      # Step 2: Log in to Azure Container Registry (ACR)
      - name: Log in to Container Registry
        uses: azure/docker-login@v1
        with:
          login-server: ${{ secrets.AZURE_REGISTRY_NAME }}.azurecr.io
          username: ${{ secrets.AZURE_REGISTRY_USERNAME }}
          password: ${{ secrets.AZURE_REGISTRY_PASSWORD }}

      # Step 3: Tag and Push Docker Image to ACR
      - name: Push Image to ACR
        run: |
          docker tag fastapi-app:v1 ${{ secrets.AZURE_REGISTRY_NAME }}.azurecr.io/fastapi-app:${{ github.sha }}
          docker tag fastapi-app:v1 ${{ secrets.AZURE_REGISTRY_NAME }}.azurecr.io/fastapi-app:latest
          docker push ${{ secrets.AZURE_REGISTRY_NAME }}.azurecr.io/fastapi-app:${{ github.sha }}
          docker push ${{ secrets.AZURE_REGISTRY_NAME }}.azurecr.io/fastapi-app:latest

      # Step 4: Deploy Container to Azure App Service
      - name: Deploy to Azure App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ secrets.AZURE_WEBAPP_NAME }}
          images: ${{ secrets.AZURE_REGISTRY_NAME }}.azurecr.io/fastapi-app:${{ github.sha }}